<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horarios - AppGuard</title>

    <link rel="stylesheet" href="modulos.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="pagina-modulo">

    <!-- MENÚ LATERAL -->
    <aside class="sidebar-modulo">

        <!-- LOGO -->
        <div class="marca-modulo">

            <img
                src="img/logo sin fondo.png"
                class="logo-modulo"
                alt="Logo AppGuard">

            <p>Control Operativo Inteligente</p>

        </div>


        <!-- MENÚ PRINCIPAL -->
        <nav class="menu-modulo">

            <a href="panel.html">
                <i class="bi bi-house-fill"></i>
                Inicio
            </a>

            <a href="#">
                <i class="bi bi-envelope"></i>
                Notificaciones
            </a>

            <a href="#">
                <i class="bi bi-gear"></i>
                Configuraciones
            </a>

            <a href="#">
                <i class="bi bi-question-circle"></i>
                Ayuda
            </a>

            <a href="index.html">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </a>

        </nav>


        <!-- ESTADO DEL SISTEMA -->
        <div class="menu-secundario">

            <div class="estado-modulo">

                <i class="bi bi-shield-check"></i>

                <div>
                    Sistema activo
                    <span class="punto-verde"></span>
                    <br>
                    y Protegido
                </div>

            </div>

        </div>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-modulo">

        <!-- ENCABEZADO -->
        <header class="encabezado-modulo">

            <div class="titulo-modulo">

                <a
                    href="panel.html"
                    class="volver-panel"
                    title="Volver al panel principal">

                    <i class="bi bi-arrow-left"></i>

                </a>

                <div>

                    <h1>Horarios</h1>

                    <p>
                        Consulta de programación del personal
                    </p>

                </div>

            </div>


            <!-- USUARIO -->
            <div class="usuario-modulo">

                <i class="bi bi-person-circle"></i>

                <div>

                    <strong>
                        BRAYAN RODRIGUEZ
                    </strong>

                    <span>
    Operador de seguridad
</span>

<span class="estado-usuario">
    Activo
</span>

                </div>

            </div>

        </header>


        <!-- PROGRAMACIÓN -->
        <section class="grid-funciones grid-horario">

            <div class="tarjeta-funcion verde programacion-card">

                <div class="icono-funcion">

                    <i class="bi bi-calendar3"></i>

                </div>

                <h3>
                    Programación
                </h3>

                <p>
                    Consulta la programación vigente
                    de turnos del personal.
                </p>

                <button
                    type="button"
                    class="btn-programacion">

                    Ver programación

                </button>

            </div>

        </section>

    </main>

</body>

</html>
