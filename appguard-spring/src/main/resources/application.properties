spring.application.name=appguard-spring

# Conexion con la base de datos MySQL de AppGuard
spring.datasource.url=jdbc:mysql://localhost:3306/appguard_db
spring.datasource.username=${APPGUARD_DB_USER}
spring.datasource.password=${APPGUARD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true