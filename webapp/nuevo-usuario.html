<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar nuevo usuario - AppGuard</title>

    <link rel="stylesheet" href="nuevo-usuario.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo-area">
            <img src="img/logo%20sin%20fondo.png" alt="Logo AppGuard">
            <p>Control Operativo Inteligente</p>
        </div>

        <nav>
            <a href="../index.html" class="activo">
                <i class="bi bi-house-fill"></i>
                Inicio
            </a>

            <a href="#">
                <i class="bi bi-envelope"></i>
                Notificaciones
            </a>

            <a href="#">
                <i class="bi bi-gear"></i>
                Configuraciones
            </a>

            <a href="#">
                <i class="bi bi-question-circle"></i>
                Ayuda
            </a>

            <a href="../index.html">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </a>
        </nav>

        <div class="estado-sistema">
    <i class="bi bi-shield-check"></i>

    <div class="estado-texto">
        <strong>Sistema activo</strong>
        <span>y Protegido</span>
    </div>

    <span class="punto-verde"></span>
</div>

        </div>
    </aside>

    <main class="contenido">

        <header class="encabezado">
            <a href="../gestionar-usuarios.html" class="volver">
                <i class="bi bi-arrow-left"></i>
            </a>

            <h1>Registrar nuevo usuario</h1>

            <div class="usuario-activo">
                <i class="bi bi-person-circle"></i>
                <div>
                    <strong>BRAYAN RODRIGUEZ</strong>
                    <span>Activo <b>●</b></span>
                </div>
            </div>
        </header>

        <section class="tarjeta-formulario">

            <div class="titulo-formulario">
                <i class="bi bi-person-plus-fill"></i>

                <div>
                    <h2>Información del usuario</h2>
                    <p>Completa los datos para registrar un nuevo usuario en el sistema.</p>
                </div>
            </div>

            <form action="usuarios" method="post">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Ingrese el nombre" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido"
                           placeholder="Ingrese el apellido" required>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" name="documento"
                           placeholder="Ingrese el documento" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo"
                           placeholder="Ingrese el correo electrónico" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono"
                           placeholder="Ingrese el teléfono">
                </div>

                <div class="campo">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="1">Administrador</option>
                        <option value="2">Supervisor</option>
                        <option value="3">Guarda</option>
                        <option value="4">Cliente</option>
                    </select>
                </div>

                <div class="acciones">
                    <a href="../gestionar-usuarios.html" class="btn-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-person-plus-fill"></i>
                        Guardar usuario
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
